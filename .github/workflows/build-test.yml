name: Build & Test

on:
    push:
        branches: ["master"]
        tags:
            - "v*.*.*"
    pull_request:
        branches: ["master"]

permissions:
    contents: write

jobs:
    build-test:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: win64
                      os: windows-latest
                      build_type: Release
                    - name: sysv
                      os: ubuntu-latest
                      build_type: Release

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Install Dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y cmake ninja-build python3-pip
                  pip3 install lit

            - name: Install Dependencies CMake (Windows)
              if: runner.os == 'Windows'
              uses: lukka/get-cmake@latest

            - name: Install Dependencies Lit (Windows)
              if: runner.os == 'Windows'
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install lit

            - name: Configure CMake
              run: >
                  cmake
                  -B ${{ github.workspace }}/build
                  -S ${{ github.workspace }}
                  -G Ninja

            - name: Build
              run: cmake --build ${{ github.workspace }}/build

            - name: Run Tests
              run: >
                  lit
                  -D compiler_exe=${{ github.workspace }}/build/compiler_c
                  -vv ${{ github.workspace }}/tests/basic ${{ github.workspace }}/tests/complex

            - name: Self Compile
              run: >
                  cmake
                  -B ${{ github.workspace }}/self_build
                  -S ${{ github.workspace}}
                  -G Ninja
                  -DCMAKE_C_COMPILER=${{ github.workspace }}/build/compiler_c
                  -DCMAKE_C_COMPILER_WORKS=true
                  -DCMAKE_C_COMPILER_ID=c_c

            - name: Self Compile Build
              run: cmake --build ${{ github.workspace }}/self_build

            - name: Run Self Compiled Tests
              run: >
                  lit
                  -D compiler_exe=${{ github.workspace }}/self_build/compiler_c
                  -vv ${{ github.workspace }}/tests/basic ${{ github.workspace }}/tests/complex

            - name: Package (Linux)
              if: runner.os == 'Linux'
              run: |
                  tar -czf build-${{ matrix.name }}.tar.gz -C build .

            - name: Package (Windows)
              if: runner.os == 'Windows'
              run: |
                  Compress-Archive -Path build\* -DestinationPath build-${{ matrix.name }}.zip

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-${{ matrix.name }}
                  path: |
                      build-${{ matrix.name }}.tar.gz
                      build-${{ matrix.name }}.zip
              if: always()

    release:
        name: Create Release
        needs: build-test
        runs-on: ubuntu-latest

        # Only run for version tags
        if: startsWith(github.ref, 'refs/tags/v')

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}

                  # v1.2.3-beta → prerelease
                  prerelease: ${{ contains(github.ref_name, '-') }}

                  generate_release_notes: true

                  files: |
                      **/*.zip
                      **/*.tar.gz

              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
